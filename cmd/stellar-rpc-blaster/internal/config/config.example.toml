# stellar-blaster configuration example
# Each endpoint can be configured with:
# [endpoints.ENDPOINT_NAME]
#   rps          - requests per second
#   start_rps    - starting requests per second, optional
#   limit        - fixed page size, overriding the traffic model's (only for paginated endpoints, optional)
# Specify the seed data input path for data dependent endpoints with:
# input_data_path = "PATH/TO/INPUTDATA.json"
# Using the default seed data output path, this is "./output/seed.json"
# Fix the random draws behind request bodies, so a run's requests can be replayed, with:
# rng_seed = 42

[endpoints.getHealth]
rps = 15
start_rps = 10

[endpoints.getLatestLedger]
rps = 15
start_rps = 10

[endpoints.getNetwork]
rps = 15
start_rps = 10

[endpoints.getVersionInfo]
rps = 15
start_rps = 10

[endpoints.getFeeStats]
rps = 15
start_rps = 5

[endpoints.getLedgerEntries]
rps = 15
start_rps = 5

[endpoints.getTransaction]
rps = 15
start_rps = 5

# The paginated endpoints may take a limit

[endpoints.getEvents]
rps = 1
start_rps = 1
limit = 1

# RPC Archive Node only; draws from the same traffic model as getEvents
# [endpoints.queryEvents]
# rps = 1
# start_rps = 1

[endpoints.getLedgers]
rps = 1
start_rps = 1
limit = 1

[endpoints.getTransactions]
rps = 1
start_rps = 1
limit = 1