[package]
name = "oz-token-contract"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/stellar/stellar-rpc-blaster"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# OpenZeppelin Stellar crates 0.6.0 currently resolve against soroban-sdk 23.x.
# Bumping this directly to the latest crates.io soroban-sdk (currently 25.3.0)
# causes macro/API incompatibilities until the OZ crates are upgraded too.
soroban-sdk = "23.5.3"
stellar-access = "=0.6.0"
stellar-contract-utils = "=0.6.0"
stellar-macros = "=0.6.0"
stellar-tokens = "=0.6.0"

[dev-dependencies]
soroban-sdk = { version = "23.5.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
